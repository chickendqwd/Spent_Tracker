name: Build iOS IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y SpentTracker-unsigned.ipa Payload
          ls -lh SpentTracker-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpentTracker-unsigned-ipa
          path: SpentTracker-unsigned.ipa
          retention-days: 90

      - name: Attach IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpentTracker-unsigned.ipa
          body: |
            ## iOS install (unsigned IPA)

            This build is an **unsigned IPA**. Sign it on your iPhone with your own Apple ID through iLoader / SideStore.

            1. Download `SpentTracker-unsigned.ipa`
            2. Place the pairing file with iLoader (see the SideStore docs), then install SideStore
            3. Import the IPA in SideStore; the bundle identifier is `com.spenttracker.spentTracker`
            4. A free Apple ID signature lasts 7 days - keep SideStore's automatic refresh enabled

            A free Apple Account can sign at most 3 apps at a time. Uninstalling clears the local Hive data; an upgrade install keeps it.
